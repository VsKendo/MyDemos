apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
      - name: springboot
        image: springboot-app:4.1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kube"
        - name: PG_URL
          value: "jdbc:postgresql://postgres-svc:5432/app_db"
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: pg-user
        - name: PG_PASS
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: pg-pass
        - name: REDIS_PASS
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: redis-pass
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-svc
  namespace: dev
spec:
  selector:
    app: springboot-app
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort